name: Bug Report  
description: File a bug report for k8s-llm-rca-bench  
title: "[Bug]: "  
labels: ["bug", "triage"]  
body:  
  - type: markdown  
    attributes:  
      value: |  
        Thanks for taking the time to report this bug! Please provide as much detail as possible.  
  - type: input  
    id: version  
    attributes:  
      label: Version  
      description: What commit hash or branch are you running?  
    validations:  
      required: true  
  - type: textarea  
    id: description  
    attributes:  
      label: Description  
      description: What happened?  
    validations:  
      required: true  
  - type: textarea  
    id: reproduction  
    attributes:  
      label: Steps to Reproduce  
      description: How can we reproduce this bug?  
    validations:  
      required: true  
  - type: textarea  
    id: expected  
    attributes:  
      label: Expected Behavior  
      description: What did you expect to happen?  
    validations:  
      required: true  
  - type: textarea  
    id: logs  
    attributes:  
      label: Relevant Logs / Tracebacks  
      description: Paste any relevant terminal output or tracebacks here.  
      render: bash
