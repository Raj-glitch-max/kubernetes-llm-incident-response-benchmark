name: Auto Leaderboard Update

on:
    push:
        paths:
            - "data/incidents.csv"
            - "eval/leaderboard.py"
        branches:
            - main
            - dev

jobs:
    update-leaderboard:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Generate Leaderboard
              run: |
                  export PYTHONPATH=$PWD
                  python3 eval/leaderboard.py
                  # Also run summary to refresh anything else if needed
                  python3 eval/results_summary.py

            - name: Commit and push changes
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add data/leaderboard.json README.md
                  git commit -m "docs: auto-update leaderboard [skip ci]" || echo "No changes to commit"
                  git push
