# This is how the comments map to a YAML file:
server:
  retention: 15d
  persistentVolume:
    enabled: true
    size: 8Gi
serverFiles:
  alerting_rules.yml:
    groups:
      - name: chaos-alerts
        rules:
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total{namespace="default"}[5m]) > 0
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is crashlooping"
